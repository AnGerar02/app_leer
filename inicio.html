<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadBok — Inicio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      .pantalla--inicio {
        align-items: center;
        justify-content: space-evenly;
        gap: 12px;
        text-align: center;
      }
      .libro-progreso {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .porcentaje {
        font-size: 3.8rem;
        font-weight: 800;
        margin-top: -8px;
      }
      .tarjetas-inicio {
        display: flex;
        gap: 18px;
        width: 100%;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <div class="telefono">
      <header class="barra-estado">
        <span>02:47 PM</span>
        <span class="iconos-estado">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
            <rect x="0" y="8" width="3" height="4" rx="1" />
            <rect x="4.5" y="5" width="3" height="7" rx="1" />
            <rect x="9" y="2" width="3" height="10" rx="1" />
            <rect x="13.5" y="0" width="3" height="12" rx="1" />
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
            <path
              d="M8 12 5.5 9.2a3.6 3.6 0 0 1 5 0Zm4.2-4.7a6.6 6.6 0 0 0-8.4 0L2.1 5.4a9.2 9.2 0 0 1 11.8 0ZM16 3.5a11.8 11.8 0 0 0-16 0l1.7 1.9a9.3 9.3 0 0 1 12.6 0Z"
            />
          </svg>
        </span>
      </header>

      <main class="pantalla pantalla--inicio">
        <h1 class="chip-titulo" id="saludo">Hola Omar</h1>

        <div class="libro-progreso">
          <svg width="300" height="224" viewBox="0 0 150 112" fill="none">
            <!-- Libro abierto: página izquierda naranja, derecha blanca con media luna -->
            <path
              class="relleno-lectura"
              d="M75 22 C58 8 30 8 14 16 V88 C30 80 58 80 75 94 Z"
              fill="#df9f3e"
            />
            <path
              d="M75 22 C92 8 120 8 136 16 V88 C120 80 92 80 75 94 Z"
              fill="#ffffff"
            />
            <!-- Avance de lectura sobre la página derecha: borde cóncavo -->
            <path
              class="relleno-lectura"
              d="M75 22 C84 14 93 12 101 12 C84 40 84 64 100 84 C91 82 83 86 75 94 Z"
              fill="#df9f3e"
            />
            <path
              d="M75 22 C58 8 30 8 14 16 V88 C30 80 58 80 75 94 C92 80 120 80 136 88 V16 C120 8 92 8 75 22 Z"
              stroke="#2c3e50"
              stroke-width="14"
              stroke-linejoin="round"
            />
            <line
              x1="75"
              y1="22"
              x2="75"
              y2="94"
              stroke="#2c3e50"
              stroke-width="14"
            />
          </svg>
          <span class="porcentaje" id="porcentaje">65%</span>
        </div>

        <div class="tarjetas-inicio">
          <div class="tarjeta-dato">
            <strong id="rachaValor">5 días</strong>
            <span>Racha</span>
          </div>
          <div class="tarjeta-dato">
            <strong>Libro</strong>
            <span id="libroValor">Patrón Bitcoin</span>
          </div>
        </div>

        <a class="btn btn--primario" href="cargando.html">Ir a leer</a>
      </main>

      <nav class="nav-inferior">
        <a href="inicio.html" class="activo" aria-label="Inicio">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          >
            <path d="M3 11 12 3l9 8" />
            <path d="M5.5 9.5V21h13V9.5" />
          </svg>
        </a>
        <a href="sesion.html" aria-label="Temporizador">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="13" r="8" />
            <path d="M12 9v4l3 2" />
            <path d="M4.5 4 2.5 6M19.5 4l2 2" />
          </svg>
        </a>
        <a href="historial.html" aria-label="Historial">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          >
            <rect x="4" y="3" width="16" height="18" rx="2" />
            <path d="M8 8h8M8 12h8M8 16h5" />
          </svg>
        </a>
        <a href="logros.html" aria-label="Logros">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          >
            <path d="M7 3h10v6a5 5 0 0 1-10 0Z" />
            <path
              d="M7 5H3.5v1.5A3.5 3.5 0 0 0 7 10M17 5h3.5v1.5A3.5 3.5 0 0 1 17 10"
            />
            <path d="M12 14v4M8 21h8M10 18h4v3h-4z" />
          </svg>
        </a>
      </nav>

      <div class="indicador-inicio"></div>
    </div>

    <script>
      // Usuario nuevo (Crear cuenta): dashboard en cero
      if (sessionStorage.getItem("perfil") === "nuevo") {
        document.getElementById("saludo").textContent = "Hola lector";
        document.getElementById("porcentaje").textContent = "0%";
        document.getElementById("rachaValor").textContent = "0 días";
        document.getElementById("libroValor").textContent = "Ninguno aún";
        document
          .querySelectorAll(".relleno-lectura")
          .forEach((p) => (p.style.display = "none"));
      }
    </script>
  </body>
</html>
