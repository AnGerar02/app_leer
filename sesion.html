<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadBok — Sesión diaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .pantalla--sesion {
      align-items: center;
      gap: 14px;
    }
    .pantalla--sesion .titulo-pantalla { margin-bottom: 4px; align-self: flex-start; }
    .pantalla--sesion .btn--secundario { align-self: flex-start; }
    .reloj {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }
    .cronometro {
      font-size: 1.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .btn-pausa {
      margin-top: 40px;
      width: 104px;
      height: 104px;
      border-radius: 50%;
      border: 10px solid var(--enfasis);
      background: transparent;
      color: var(--enfasis);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-pausa svg { width: 46px; height: 46px; }
    .pantalla--sesion .btn--primario { margin-top: auto; }
  </style>
</head>
<body>

  <div class="telefono">

    <header class="barra-estado">
      <span>02:47 PM</span>
      <span class="iconos-estado">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 12 5.5 9.2a3.6 3.6 0 0 1 5 0Zm4.2-4.7a6.6 6.6 0 0 0-8.4 0L2.1 5.4a9.2 9.2 0 0 1 11.8 0ZM16 3.5a11.8 11.8 0 0 0-16 0l1.7 1.9a9.3 9.3 0 0 1 12.6 0Z"/></svg>
      </span>
    </header>

    <main class="pantalla pantalla--sesion">

      <h1 class="titulo-pantalla">Sesión diaria</h1>
      <a class="btn btn--secundario" href="meta.html">Modificar meta diaria</a>

      <div class="reloj">
        <svg width="155" height="155" viewBox="0 0 120 120" fill="none">
          <!-- Aro abierto arriba a la derecha, manecillas cuadradas -->
          <path d="M104.4 48.1 A46 46 0 1 1 71.9 15.6" stroke="#df9f3e" stroke-width="11" stroke-linecap="butt"/>
          <path d="M60 62 V28" stroke="#df9f3e" stroke-width="11" stroke-linecap="butt"/>
          <path d="M57 57 L81 81" stroke="#df9f3e" stroke-width="11" stroke-linecap="butt"/>
        </svg>
        <span class="cronometro" id="cronometro">00:00,00</span>
      </div>

      <button class="btn-pausa" id="btnPausa" aria-label="Iniciar / pausar">
        <svg id="iconoPausa" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5.5" y="4" width="5" height="16" rx="1"/><rect x="13.5" y="4" width="5" height="16" rx="1"/></svg>
        <svg id="iconoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <a class="btn btn--primario" href="inicio.html">Guardar</a>

    </main>

    <nav class="nav-inferior">
      <a href="inicio.html" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5.5 9.5V21h13V9.5"/></svg>
      </a>
      <a href="sesion.html" class="activo" aria-label="Temporizador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M4.5 4 2.5 6M19.5 4l2 2"/></svg>
      </a>
      <a href="historial.html" aria-label="Historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      </a>
      <a href="logros.html" aria-label="Logros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3h10v6a5 5 0 0 1-10 0Z"/><path d="M7 5H3.5v1.5A3.5 3.5 0 0 0 7 10M17 5h3.5v1.5A3.5 3.5 0 0 1 17 10"/><path d="M12 14v4M8 21h8M10 18h4v3h-4z"/></svg>
      </a>
    </nav>

    <div class="indicador-inicio"></div>
  </div>

  <script>
    // Cronómetro de la sesión: arranca con el botón, se pausa y se reanuda
    const pantalla = document.getElementById('cronometro');
    const btnPausa = document.getElementById('btnPausa');
    const iconoPausa = document.getElementById('iconoPausa');
    const iconoPlay = document.getElementById('iconoPlay');

    let transcurrido = 0;      // milisegundos acumulados
    let ultimoInicio = 0;
    let corriendo = false;

    function pintar() {
      const total = corriendo ? transcurrido + (Date.now() - ultimoInicio) : transcurrido;
      const min = String(Math.floor(total / 60000)).padStart(2, '0');
      const seg = String(Math.floor(total / 1000) % 60).padStart(2, '0');
      const cent = String(Math.floor(total / 10) % 100).padStart(2, '0');
      pantalla.textContent = `${min}:${seg},${cent}`;
    }

    setInterval(pintar, 33);

    btnPausa.addEventListener('click', () => {
      if (corriendo) {
        transcurrido += Date.now() - ultimoInicio;
      } else {
        ultimoInicio = Date.now();
      }
      corriendo = !corriendo;
      iconoPausa.style.display = corriendo ? '' : 'none';
      iconoPlay.style.display = corriendo ? 'none' : '';
    });
  </script>

</body>
</html>
