<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadBok — Configurar meta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .opciones-tiempo {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 230px;
      margin: 6px 0 10px;
    }
    .opcion-tiempo {
      font-family: var(--fuente);
      font-weight: 700;
      font-size: var(--h4);
      color: var(--fondo);
      background: var(--corporativo);
      border: none;
      border-radius: 12px;
      padding: 16px 10px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(44, 62, 80, 0.25);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .opcion-tiempo:hover { background: var(--corporativo-hover); }
    .opcion-tiempo.seleccionada {
      background: var(--enfasis);
      transform: translateY(2px);
      box-shadow: none;
    }
    .enlace-recordatorio {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--texto);
      font-size: var(--h5);
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--fuente);
      cursor: pointer;
      margin: 4px 0;
    }
    .enlace-recordatorio svg {
      color: var(--enfasis);
      transition: transform 0.25s ease;
    }
    .enlace-recordatorio.abierto svg { transform: rotate(45deg); }

    /* Panel desplegable del recordatorio */
    .panel-recordatorio {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 6px 0 4px;
    }
    .agregar-recordatorio {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .agregar-recordatorio input[type="time"] {
      font-family: var(--fuente);
      font-weight: 700;
      font-size: var(--h5);
      color: var(--texto);
      border: 1.5px solid var(--texto);
      border-radius: 10px;
      padding: 7px 10px;
      background: var(--fondo);
    }
    .btn--agregar { font-size: var(--h6); padding: 9px 20px; }
    .lista-recordatorios {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .recordatorio {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: var(--h5);
      font-weight: 700;
    }
    .recordatorio svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn--eliminar {
      margin-left: auto;
      font-size: 0.75rem;
      padding: 5px 14px;
    }
    .pantalla--meta .btn--primario { margin-top: auto; align-self: center; }
  </style>
</head>
<body>

  <div class="telefono">

    <header class="barra-estado">
      <span>02:47 PM</span>
      <span class="iconos-estado">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 12 5.5 9.2a3.6 3.6 0 0 1 5 0Zm4.2-4.7a6.6 6.6 0 0 0-8.4 0L2.1 5.4a9.2 9.2 0 0 1 11.8 0ZM16 3.5a11.8 11.8 0 0 0-16 0l1.7 1.9a9.3 9.3 0 0 1 12.6 0Z"/></svg>
      </span>
    </header>

    <main class="pantalla pantalla--meta">

      <h1 class="titulo-pantalla">Configurar meta</h1>

      <h2 class="subtitulo">Tiempo de<br>lectura diario</h2>
      <div class="opciones-tiempo">
        <button class="opcion-tiempo" type="button">10 min</button>
        <button class="opcion-tiempo seleccionada" type="button">15 min</button>
        <button class="opcion-tiempo" type="button">20 min</button>
        <button class="opcion-tiempo" type="button">Otro...</button>
      </div>

      <h2 class="subtitulo">Horario de lectura</h2>
      <button class="enlace-recordatorio" id="btnRecordatorio" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        Configurar recordatorio
      </button>

      <div class="panel-recordatorio" id="panelRecordatorio" hidden>
        <div class="agregar-recordatorio">
          <input type="time" id="horaRecordatorio" value="20:00" aria-label="Hora del recordatorio">
          <button class="btn btn--acento btn--agregar" id="btnAgregar" type="button">Agregar</button>
        </div>
        <ul class="lista-recordatorios" id="listaRecordatorios"></ul>
      </div>

      <a class="btn btn--primario" href="inicio.html">Guardar configuración</a>

    </main>

    <nav class="nav-inferior">
      <a href="inicio.html" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5.5 9.5V21h13V9.5"/></svg>
      </a>
      <a href="sesion.html" aria-label="Temporizador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M4.5 4 2.5 6M19.5 4l2 2"/></svg>
      </a>
      <a href="historial.html" aria-label="Historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      </a>
      <a href="logros.html" aria-label="Logros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3h10v6a5 5 0 0 1-10 0Z"/><path d="M7 5H3.5v1.5A3.5 3.5 0 0 0 7 10M17 5h3.5v1.5A3.5 3.5 0 0 1 17 10"/><path d="M12 14v4M8 21h8M10 18h4v3h-4z"/></svg>
      </a>
    </nav>

    <div class="indicador-inicio"></div>
  </div>

  <script>
    // Selección única del tiempo de lectura
    document.querySelectorAll('.opcion-tiempo').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.opcion-tiempo.seleccionada')?.classList.remove('seleccionada');
        btn.classList.add('seleccionada');
      });
    });

    // Recordatorios: desplegar panel, agregar y eliminar horarios
    const btnRecordatorio = document.getElementById('btnRecordatorio');
    const panel = document.getElementById('panelRecordatorio');
    const lista = document.getElementById('listaRecordatorios');
    const hora = document.getElementById('horaRecordatorio');

    btnRecordatorio.addEventListener('click', () => {
      panel.hidden = !panel.hidden;
      btnRecordatorio.classList.toggle('abierto', !panel.hidden);
    });

    function formato12h(valor) {
      let [h, m] = valor.split(':').map(Number);
      const sufijo = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} ${sufijo}`;
    }

    function agregarRecordatorio(valor) {
      const fila = document.createElement('li');
      fila.className = 'recordatorio';
      fila.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M4.5 4 2.5 6M19.5 4l2 2"/></svg>
        <span>${formato12h(valor)}</span>
        <button class="btn btn--destructivo btn--eliminar" type="button">Eliminar</button>`;
      fila.querySelector('.btn--eliminar').addEventListener('click', () => fila.remove());
      lista.appendChild(fila);
    }

    document.getElementById('btnAgregar').addEventListener('click', () => {
      if (hora.value) agregarRecordatorio(hora.value);
    });

    // Recordatorio de ejemplo para que la lista no arranque vacía
    agregarRecordatorio('20:00');
  </script>

</body>
</html>
