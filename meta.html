<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadBok — Configurar meta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .opciones-tiempo {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 230px;
      margin: 6px 0 10px;
    }
    .opcion-tiempo {
      font-family: var(--fuente);
      font-weight: 700;
      font-size: var(--h4);
      color: var(--fondo);
      background: var(--corporativo);
      border: none;
      border-radius: 12px;
      padding: 16px 10px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(44, 62, 80, 0.25);
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .opcion-tiempo:hover { background: var(--corporativo-hover); }
    .opcion-tiempo.seleccionada {
      background: var(--enfasis);
      transform: translateY(2px);
      box-shadow: none;
    }
    .enlace-recordatorio {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--texto);
      font-size: var(--h5);
      font-weight: 600;
      text-decoration: none;
      margin: 4px 0;
    }
    .enlace-recordatorio svg { color: var(--enfasis); }
    .pantalla--meta .btn--primario { margin-top: auto; align-self: center; }
  </style>
</head>
<body>

  <div class="telefono">

    <header class="barra-estado">
      <span>02:47 PM</span>
      <span class="iconos-estado">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 12 5.5 9.2a3.6 3.6 0 0 1 5 0Zm4.2-4.7a6.6 6.6 0 0 0-8.4 0L2.1 5.4a9.2 9.2 0 0 1 11.8 0ZM16 3.5a11.8 11.8 0 0 0-16 0l1.7 1.9a9.3 9.3 0 0 1 12.6 0Z"/></svg>
      </span>
    </header>

    <main class="pantalla pantalla--meta">

      <h1 class="titulo-pantalla">Configurar meta</h1>

      <h2 class="subtitulo">Tiempo de<br>lectura diario</h2>
      <div class="opciones-tiempo">
        <button class="opcion-tiempo" type="button">10 min</button>
        <button class="opcion-tiempo seleccionada" type="button">15 min</button>
        <button class="opcion-tiempo" type="button">20 min</button>
        <button class="opcion-tiempo" type="button">Otro...</button>
      </div>

      <h2 class="subtitulo">Horario de lectura</h2>
      <a class="enlace-recordatorio" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        Configurar recordatorio
      </a>

      <a class="btn btn--primario" href="inicio.html">Guardar configuración</a>

    </main>

    <nav class="nav-inferior">
      <a href="inicio.html" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5.5 9.5V21h13V9.5"/></svg>
      </a>
      <a href="sesion.html" aria-label="Temporizador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M4.5 4 2.5 6M19.5 4l2 2"/></svg>
      </a>
      <a href="historial.html" aria-label="Historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      </a>
      <a href="logros.html" aria-label="Logros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3h10v6a5 5 0 0 1-10 0Z"/><path d="M7 5H3.5v1.5A3.5 3.5 0 0 0 7 10M17 5h3.5v1.5A3.5 3.5 0 0 1 17 10"/><path d="M12 14v4M8 21h8M10 18h4v3h-4z"/></svg>
      </a>
    </nav>

    <div class="indicador-inicio"></div>
  </div>

  <script>
    // Selección única del tiempo de lectura
    document.querySelectorAll('.opcion-tiempo').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.opcion-tiempo.seleccionada')?.classList.remove('seleccionada');
        btn.classList.add('seleccionada');
      });
    });
  </script>

</body>
</html>
