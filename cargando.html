<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadBok — Cargando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .pantalla--cargando {
      justify-content: center;
      align-items: center;
      gap: 40px;
      perspective: 700px;
    }
    .libro-girando {
      animation: girar 1.5s linear infinite;
      transform-style: preserve-3d;
    }
    @keyframes girar {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }
    .texto-cargando {
      font-size: var(--h2);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="telefono">

    <header class="barra-estado">
      <span>02:47 PM</span>
      <span class="iconos-estado">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 12 5.5 9.2a3.6 3.6 0 0 1 5 0Zm4.2-4.7a6.6 6.6 0 0 0-8.4 0L2.1 5.4a9.2 9.2 0 0 1 11.8 0ZM16 3.5a11.8 11.8 0 0 0-16 0l1.7 1.9a9.3 9.3 0 0 1 12.6 0Z"/></svg>
      </span>
    </header>

    <main class="pantalla pantalla--cargando">
      <svg class="libro-girando" width="200" height="150" viewBox="0 0 150 112" fill="none">
        <path d="M75 22 C58 8 30 8 14 16 V88 C30 80 58 80 75 94 C92 80 120 80 136 88 V16 C120 8 92 8 75 22 Z" stroke="#9e2a2b" stroke-width="14" stroke-linejoin="round"/>
        <line x1="75" y1="22" x2="75" y2="94" stroke="#9e2a2b" stroke-width="14"/>
      </svg>
      <p class="texto-cargando">Cargando...</p>
    </main>

    <div class="indicador-inicio"></div>
  </div>

  <script>
    // Simula la carga y pasa a la sesión de lectura
    setTimeout(() => { window.location.href = 'sesion.html'; }, 2200);
  </script>

</body>
</html>
