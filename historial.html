<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadBok — Historial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .fila-dato {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .chip-minutos {
      background: var(--corporativo);
      color: var(--fondo);
      font-weight: 800;
      font-size: var(--h3);
      padding: 10px 20px;
      border-radius: 12px;
    }
    /* Carrusel de libros: se arrastra con el dedo o el mouse, sin barra visible */
    .libros-leidos {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      margin: 4px -28px 8px;
      padding: 0 28px 4px;
      cursor: grab;
      scrollbar-width: none;      /* Firefox */
      user-select: none;
    }
    .libros-leidos::-webkit-scrollbar { display: none; }  /* Chrome/Edge */
    .libros-leidos.arrastrando { cursor: grabbing; }
    .libro-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--texto);
      color: var(--fondo);
      font-size: var(--h5);
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 18px;
      min-width: 118px;
      min-height: 88px;
      text-align: center;
    }
    .grafica { margin-top: 18px; }
    .grafica text {
      font-family: var(--fuente);
      font-size: 11px;
      font-weight: 600;
      fill: var(--texto);
    }
    /* Las barras crecen desde la base al entrar */
    .grafica .barra {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: crecerBarra 0.9s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    }
    .grafica .barra:nth-child(2) { animation-delay: 0.15s; }
    .grafica .barra:nth-child(3) { animation-delay: 0.3s; }
    .grafica .barra:nth-child(4) { animation-delay: 0.45s; }
    @keyframes crecerBarra {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }
  </style>
</head>
<body>

  <div class="telefono">

    <header class="barra-estado">
      <span>02:47 PM</span>
      <span class="iconos-estado">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 12 5.5 9.2a3.6 3.6 0 0 1 5 0Zm4.2-4.7a6.6 6.6 0 0 0-8.4 0L2.1 5.4a9.2 9.2 0 0 1 11.8 0ZM16 3.5a11.8 11.8 0 0 0-16 0l1.7 1.9a9.3 9.3 0 0 1 12.6 0Z"/></svg>
      </span>
    </header>

    <main class="pantalla">

      <h1 class="titulo-pantalla">Historial</h1>

      <div class="fila-dato">
        <h2 class="subtitulo">Minutos<br>acumulados</h2>
        <span class="chip-minutos" id="minutosValor">130 min</span>
      </div>

      <h2 class="subtitulo">Libros<br>leídos</h2>
      <div class="libros-leidos">
        <div class="libro-chip">El Zorro</div>
        <div class="libro-chip">Blancanieves</div>
        <div class="libro-chip">Caperucita<br>lobo feroz</div>
      </div>

      <!-- Constancia semanal: barras vs. meta diaria (línea punteada) -->
      <svg class="grafica" viewBox="0 0 320 190">
        <text x="16" y="100" transform="rotate(-90 16 100)" text-anchor="middle">15 min</text>
        <g>
          <rect class="barra" x="50"  y="85"  width="44" height="65"  rx="9" fill="#df9f3e"/>
          <rect class="barra" x="117" y="45"  width="44" height="105" rx="9" fill="#df9f3e"/>
          <rect class="barra" x="184" y="105" width="44" height="45"  rx="9" fill="#9e2a2b"/>
          <rect class="barra" x="251" y="75"  width="44" height="75"  rx="9" fill="#df9f3e"/>
        </g>
        <line x1="38" y1="78" x2="310" y2="78" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.65"/>
        <line x1="38" y1="12" x2="38" y2="150" stroke="#2c3e50" stroke-width="2"/>
        <line x1="30" y1="150" x2="312" y2="150" stroke="#2c3e50" stroke-width="2"/>
        <line x1="105" y1="150" x2="105" y2="158" stroke="#2c3e50" stroke-width="2"/>
        <line x1="172" y1="150" x2="172" y2="158" stroke="#2c3e50" stroke-width="2"/>
        <line x1="239" y1="150" x2="239" y2="158" stroke="#2c3e50" stroke-width="2"/>
        <line x1="306" y1="150" x2="306" y2="158" stroke="#2c3e50" stroke-width="2"/>
        <text x="72"  y="172" text-anchor="middle">sem 1</text>
        <text x="139" y="172" text-anchor="middle">sem 2</text>
        <text x="206" y="172" text-anchor="middle">sem 3</text>
        <text x="273" y="172" text-anchor="middle">sem 4</text>
      </svg>

    </main>

    <nav class="nav-inferior">
      <a href="inicio.html" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5.5 9.5V21h13V9.5"/></svg>
      </a>
      <a href="sesion.html" aria-label="Temporizador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M4.5 4 2.5 6M19.5 4l2 2"/></svg>
      </a>
      <a href="historial.html" class="activo" aria-label="Historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      </a>
      <a href="logros.html" aria-label="Logros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3h10v6a5 5 0 0 1-10 0Z"/><path d="M7 5H3.5v1.5A3.5 3.5 0 0 0 7 10M17 5h3.5v1.5A3.5 3.5 0 0 1 17 10"/><path d="M12 14v4M8 21h8M10 18h4v3h-4z"/></svg>
      </a>
    </nav>

    <div class="indicador-inicio"></div>
  </div>

  <script>
    // Arrastrar el carrusel de libros con mouse o dedo (sin barra de scroll)
    const carrusel = document.querySelector('.libros-leidos');
    let arrastrando = false, inicioX = 0, scrollInicial = 0;

    carrusel.addEventListener('pointerdown', e => {
      arrastrando = true;
      inicioX = e.clientX;
      scrollInicial = carrusel.scrollLeft;
      carrusel.classList.add('arrastrando');
      carrusel.setPointerCapture(e.pointerId);
    });

    carrusel.addEventListener('pointermove', e => {
      if (!arrastrando) return;
      carrusel.scrollLeft = scrollInicial - (e.clientX - inicioX);
    });

    ['pointerup', 'pointercancel'].forEach(ev =>
      carrusel.addEventListener(ev, () => {
        arrastrando = false;
        carrusel.classList.remove('arrastrando');
      })
    );

    // Usuario nuevo (Crear cuenta): historial en cero
    if (sessionStorage.getItem('perfil') === 'nuevo') {
      document.getElementById('minutosValor').textContent = '0 min';
      carrusel.innerHTML = '<p class="etiqueta">Aún no has terminado tu primer libro</p>';
      document.querySelectorAll('.grafica .barra').forEach(b => b.style.display = 'none');
    }
  </script>

</body>
</html>
